<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#16181c" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>DropLink</title>
    <script>try{var t=JSON.parse(localStorage.getItem('droplink.theme')||'"system"');var d=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';var x=JSON.parse(localStorage.getItem('droplink.display')||'{}');if(x.text)document.documentElement.dataset.text=x.text;if(x.contrast)document.documentElement.dataset.contrast=x.contrast;if(x.motion)document.documentElement.dataset.motion=x.motion;if(x.density)document.documentElement.dataset.density=x.density}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
