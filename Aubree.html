form .25s ease}h1{margin:0 0 8px;font-size:clamp(26px,6vw,32px);font-weight:600;letter-spacing:-.5px}p{margin:0 0 22px;color:var(--muted);font-size:15px;line-height:1.5}b{border:0;border-radius:5px;padding:13px 22px;background:var(--accent);color:white;font:600 15px "Segoe UI",system-ui,sans-serif;cursor:pointer;transition:background .15s ease,transform .15s ease}b:hover{background:var(--accent-hover)}b:active{transform:translateY(1px)}b:focus-visible{outline:3px solid #9edfc3;outline-offset:3px}.s.revealed .character{opacity:1;transform:translateY(0) scale(1)}.s.revealed .speech{opacity:1;transform:translateY(0);transition-delay:.3s}.s.revealed .character img{animation:happy-bounce .85s .35s ease-in-out both}@keyframes happy-bounce{0%{transform:translateY(0)}28%{transform:translateY(-13px) rotate(-3deg)}52%{transform:translateY(0) rotate(2deg)}72%{transform:translateY(-5px) rotate(-1deg)}100%{transform:translateY(0) rotate(0)}}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}</style></head><body><main class="s" id="s"><div class="topbar"><b class="theme-toggle" id="t" type="b" aria-label="Switch to light theme"><span id="i" aria-hidden="true">☀</span><span id="l">Light mode</span></b></div><h1>Who's here?</h1><p>There's a little surprise waiting.</p><section class="card" aria-label="Surprise reveal"><div class="glow"></div><div class="character"><img alt="A cute little character" src="data:image/webp;base64,UklGRjwtCQBXRUJQVlA4WAoAAAASAAAAjwEAjwEAQU5JTQYAAAD/////AABBTk1GOlMAAAAAAAAAAI8BAI8BAEIAAAJWUDhMIlMAAC+PwWMQTUiSbbduI78HWKDzHva/YNIfaNTVo4j+TwD+45RuFnDj6JtEtG1J2AvIG7RdJHYbnZlTtC3o4PgjMjOHbEM4yi39VRU5Q1NvFver1th+4lF9P+oGWm9weEpDQboJEgbJIsmxDtK+XmSx11Y9Q1ru7iYLwayqapscoQygg9ivC25ZQyQ+tSDZnFnfWWZMgF1+Pj8h7CZHMq8L9QEu2xEjAalb8c5sySMRNtzSO5bE/Xe2AaiU78zz78iS6DB5gnsqdcFyf8TVOYIEgEf79YHXqhwBoFb3R+A+RNkbNxKa4xmwD3zdYB3Ifm6Sb3B0qQFYEm8h0H4AQDdsjYHG/ogNgjmXAGArgMTec28d+De8gOTadtvmwPgg3O3
