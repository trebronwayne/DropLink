<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Members</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
<main>
  <section class="card">
    <h1 id="hello">Members area</h1>
    <p>This page lives in the <code>private</code> folder, so DropLink only serves it to signed-in visitors.</p>
    <form id="note">
      <textarea name="note" rows="3" placeholder="Leave a note for the host" required></textarea>
      <button class="primary">Send note</button>
    </form>
    <p id="msg" class="msg" role="status"></p>
    <a href="../index.html"><button type="button">Back</button></a>
  </section>
</main>
<script>
fetch('/site-api/me').then(r => r.json()).then(me => { if (me.user) document.getElementById('hello').textContent = `Hello, ${me.user}` })
document.getElementById('note').addEventListener('submit', async e => {
  e.preventDefault()
  const note = new FormData(e.target).get('note')
  const r = await fetch('/site-api/submit/member-note', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ note }) })
  const msg = document.getElementById('msg')
  msg.className = 'msg ' + (r.ok ? 'ok' : 'err'); msg.textContent = r.ok ? 'Sent.' : 'Could not send it.'
  if (r.ok) e.target.reset()
})
</script>
</body>
</html>
